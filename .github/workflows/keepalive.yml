name: Keep repository active

on:
  schedule:
    # Run twice each month so the public repository receives activity well before GitHub's 60-day inactivity threshold.
    - cron: '23 9 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Refresh activity marker
        run: |
          mkdir -p .github
          date -u +"Last automatic repository activity refresh: %Y-%m-%d %H:%M UTC" > .github/keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh repository activity marker"
            git push origin HEAD:main
          fi
